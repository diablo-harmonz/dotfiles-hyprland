# Kernel settings for swap on zram (values from the ArchWiki zram page).
# Installed to /etc/sysctl.d/ by setup/install-system-files.sh.
#   swappiness 180      zram is far cheaper than dropping file cache, so swap earlier
#   page-cluster 0      read one page at a time from zram (no readahead: lower latency)
#   watermark_boost 0   no extra reclaim bursts after memory fragmentation
#   watermark_scale 125 start background reclaim a bit earlier (fewer stalls)
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
