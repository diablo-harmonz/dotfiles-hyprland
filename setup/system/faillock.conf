# pam_faillock (installed by setup/install-system-files.sh to /etc/security/faillock.conf).
# Defaults are 3 failures within 15 min -> locked for 10 min, too harsh for typos on the
# lock screen. See faillock.conf(5). Unlock by hand: faillock --user $USER --reset
deny = 5
fail_interval = 900
unlock_time = 120
