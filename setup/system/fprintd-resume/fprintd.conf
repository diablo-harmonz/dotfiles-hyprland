# Drop-in for systemd-hibernate, systemd-hybrid-sleep and systemd-suspend-then-hibernate.service
# (installed as /etc/systemd/system/<unit>.d/fprintd.conf by setup/install-system-files.sh).
# Restart fprintd once the whole sleep is over. hyprlock starts reading the finger as the lid
# closes, so the Synaptics sensor goes to sleep "busy" (fprintd: "Unexpected error while
# suspending device"). After a hibernate the sensor came back stuck: the next finger reads
# failed with "Device was already claimed" (KeePassXC Quick Unlock hung in the polkit prompt,
# 2026-11-27) until fprintd was restarted.
# The restart must finish BEFORE the unit does: logind tells hyprlock "awake" (PrepareForSleep
# false) only after this unit ends, and hyprlock claims the sensor again at that moment. With
# --no-block the restart raced that claim and dropped it (2026-11-27 22:08, hyprlock: "Device
# was not claimed before use", no finger on the lock screen). timeout: a hung restart can delay
# the wake by 15 s at most. "-" = a failure here never fails the sleep unit.
[Service]
ExecStartPost=-/usr/bin/timeout 15 /usr/bin/systemctl restart fprintd.service
