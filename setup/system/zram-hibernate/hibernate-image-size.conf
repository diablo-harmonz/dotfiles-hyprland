# tmpfiles.d (installed as /etc/tmpfiles.d/hibernate-image-size.conf): cap the hibernate image
# at 3 GiB (kernel default: 2/5 of RAM, about 6 GiB here). Before writing the image the kernel
# must squeeze it under this size, so it swaps more out to /swap/swapfile first. With the
# default it stopped too early on suspend-then-hibernate, where zram stays on and its data sits
# in RAM: 2026-11-27 16:59 "Normal pages needed: 1993511 + 1024, available pages: 1844928",
# "Error -12 creating image", and the laptop went back to plain suspend for 5 hours.
# Cost: programs page back in from the swapfile for a few seconds after the wake.
w /sys/power/image_size - - - - 3221225472
