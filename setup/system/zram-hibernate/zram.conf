# Drop-in for systemd-hibernate.service and systemd-hybrid-sleep.service (installed as
# /etc/systemd/system/<unit>.d/zram.conf): zram off before, back on after. NOT for
# systemd-suspend-then-hibernate: with zram turned off there the resume failed every time.
# See zram-hibernate in this folder. "-" = a failure here never blocks the sleep.
[Service]
ExecStartPre=-/usr/local/lib/zram-hibernate pre
ExecStartPost=-/usr/local/lib/zram-hibernate post
