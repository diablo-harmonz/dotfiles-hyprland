# Compressed swap in RAM (Manjaro enables this by itself, Arch does not).
# Installed to /etc/systemd/zram-generator.conf by setup/install-system-files.sh.
# Size = all of the RAM: zstd packs ~3.5:1 here (6.6 GB of data in 1.9 GB), so a
# full zram0 uses about a quarter of the RAM. Half the RAM filled up during heavy
# test runs and the machine stuttered. The size is a ceiling, not a reservation.
# A new size applies at the next boot.
[zram0]
zram-size = ram
compression-algorithm = zstd
