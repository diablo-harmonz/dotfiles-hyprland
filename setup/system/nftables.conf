#!/usr/bin/nft -f
# Laptop firewall (installed by setup/install-system-files.sh to /etc/nftables.conf,
# loaded at boot by nftables.service).
#   - Nothing from the network may connect in; replies to connections this laptop
#     opened are allowed. Dev servers listening on 0.0.0.0 are therefore not reachable
#     from the Wi-Fi (use the loopback address, or add a rule below while needed).
#   - Docker containers and libvirt VMs may reach the host (DNS, DHCP, local services).
#   - Ports published by Docker are reachable from this laptop only: the forward chain
#     drops new connections from the network to containers. It does not drop forwarding
#     as a whole (Arch's default file does), which would cut containers and VMs off the
#     network; Docker and libvirt manage forwarding in their own tables.
# Only this table is replaced on reload (no "flush ruleset"), so Docker's and libvirt's
# rules survive `systemctl restart nftables`.
# Check: sudo nft list table inet firewall   Counters of dropped packets: last line.

destroy table inet firewall
table inet firewall {
    chain input {
        type filter hook input priority filter
        policy drop

        ct state invalid drop comment "early drop of invalid connections"
        ct state { established, related } accept comment "replies to our own connections"
        iif lo accept comment "loopback"

        # ICMP: ping, path MTU, and IPv6 neighbour discovery (IPv6 breaks without it)
        meta l4proto { icmp, icmpv6 } accept

        # DHCPv6 replies from the router (DHCPv4 uses a raw socket and is not filtered)
        ip6 saddr fe80::/10 udp dport dhcpv6-client accept

        # Containers and VMs talking to the host
        iifname { "docker0", "br-*", "virbr*" } accept comment "Docker / libvirt bridges"

        # Everything else: politely refuse (rate limited), then drop and count
        pkttype host limit rate 5/second reject with icmpx type admin-prohibited
        counter comment "dropped"
    }

    # Docker publishes ports (-p 5432:5432 = 0.0.0.0:5432) with its own NAT rules, so
    # connections from the Wi-Fi/LAN to them are forwarded, not seen by "input". Drop
    # new ones here. Not affected: the laptop itself reaching containers (localhost or
    # the bridge IP), containers reaching the internet and the host, replies.
    # A drop in any chain is final, so Docker's own accept rules cannot undo it.
    chain forward {
        type filter hook forward priority filter
        policy accept

        iifname { "wl*", "en*", "eth*", "ww*" } oifname { "docker0", "br-*" } ct state new counter drop comment "network -> containers"
    }
}
