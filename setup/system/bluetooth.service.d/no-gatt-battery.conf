# Disable BlueZ's GATT battery plugin. Some headsets (Marshall Major V) report 0 % over
# the GATT Battery Service but the real level over HFP (AT+BIEV). PipeWire forwards the
# HFP level as a battery provider, which BlueZ only accepts when no GATT battery exists.
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd -P battery
