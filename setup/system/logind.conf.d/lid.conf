# Lid closed: suspend, then hibernate after HibernateDelaySec (sleep.conf.d/hibernate.conf),
# on battery and on AC (HandleLidSwitchExternalPower is unset, so it follows this).
# zram stays on for this one: turning it off before suspend-then-hibernate made every resume
# fail (docs/sleep.md, 2026-11-26). A busy zram can make the hibernate abort ("Error -12");
# systemd then goes back to suspend. If resumes fail again, use HandleLidSwitch=suspend.
# Docked (external monitor) stays "ignore"; bin/display-toggle and caffeine also hold a
# handle-lid-switch inhibitor. Apply: sudo systemctl kill -s HUP systemd-logind
# (never restart systemd-logind: that ends the running session).
[Login]
HandleLidSwitch=suspend-then-hibernate
