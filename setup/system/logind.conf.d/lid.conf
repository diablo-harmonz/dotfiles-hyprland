# Lid closed: plain suspend (s2idle), on battery and on AC (HandleLidSwitchExternalPower is
# unset, so it follows this).
# Was suspend-then-hibernate until 2026-11-25: the AMD GPU (amdgpu, gfx_v11_0) failed to
# resume from hibernate ("MES failed to respond", resume failed -110) and broke the Hyprland
# session. Details: docs/sleep.md (hibernate section). To bring it back once a kernel/firmware
# fixes it: HandleLidSwitch=suspend-then-hibernate (delay in sleep.conf.d/hibernate.conf).
# Docked (external monitor) stays "ignore"; bin/display-toggle and caffeine also hold a
# handle-lid-switch inhibitor. Apply: sudo systemctl kill -s HUP systemd-logind
# (never restart systemd-logind: that ends the running session).
[Login]
HandleLidSwitch=suspend
