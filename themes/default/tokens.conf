# Design tokens: the one place for the shapes and fonts of the whole desktop.
# bin/tokens turns them into a file per format in ~/.config/theme-tokens/ (rofi, Quickshell,
# GTK 4, Waybar, Hyprland, hyprlock); every config reads its sizes from there, never a number
# of its own. bin/theme apply runs bin/tokens.
# Other packs: put a tokens.conf with only the keys that differ; the rest comes from here.
# Check: grep for border-radius / rounding / radius outside these files = not synced yet.

# Corners: slightly square (pixels)
RADIUS_LG=8        # big surfaces: launcher, Settings, power menu tiles, notifications, windows
RADIUS_MD=6        # cards, rows, buttons, Waybar pills
RADIUS_SM=4        # small parts: text fields, segmented inner buttons, chips

# Lines
BORDER=1           # border width (pixels)

# Type
FONT_UI="Noto Sans"                 # interface text
FONT_UI_SIZE=11                     # points
FONT_MONO="FiraCode Nerd Font"      # terminal, numbers, icon glyphs
FONT_MONO_SIZE=11                   # points

# Backdrop behind panels and dialogs (0 = none, 1 = black)
DIM=0.30

# Panels and bars: how opaque their background is (the rest shows the blurred desktop)
# Waybar, Control Center, Settings, notifications, launcher and rofi menus
PANEL_ALPHA=0.82
