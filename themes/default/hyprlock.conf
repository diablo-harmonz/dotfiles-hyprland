# Default theme: blurred wallpaper, date and greeting top left, hours over minutes in the
# middle, a small password pill under them. Sourced by ~/.config/hypr/hyprlock.conf.

background {
    monitor =
    path = $HOME/.cache/wallpaper/current
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    vibrancy = 0.2
}

# Date, top left
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%a, %b %d"
    color = $text_color
    font_size = 15
    font_family = $font
    position = 110, -110
    halign = left
    valign = top
}

# Greeting under the date
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ "$h" -lt 12 ]; then g="Good morning"; elif [ "$h" -lt 18 ]; then g="Good afternoon"; else g="Good evening"; fi; echo "$g, $USER"
    color = $text_color
    font_size = 15
    font_family = $font
    position = 110, -140
    halign = left
    valign = top
}

# Hours
label {
    monitor =
    text = cmd[update:1000] date +"%I"
    color = $hour_color
    font_size = 150
    font_family = $font_bold
    position = 0, 210
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $minute_color
    font_size = 150
    font_family = $font_bold
    position = 0, 10
    halign = center
    valign = center
}

# Password pill: always visible (no fade while empty)
input-field {
    monitor =
    size = 260, 40
    outline_thickness = 2
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $input_outer
    inner_color = $input_inner
    font_color = $input_font
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = $check_color
    fail_color = $fail_color
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $caps_color
    position = 0, -170
    halign = center
    valign = center
}

# Fingerprint messages (only shown when it is enabled, see ~/.config/hypr/hyprlock.conf)
auth {
    fingerprint {
        ready_message = Touch the power button or type your password
        present_message = Reading fingerprint…
    }
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = $text_color
    font_size = 11
    font_family = $font
    position = 0, -215
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTFAIL
    color = $fail_color
    font_size = 11
    font_family = $font
    position = 0, -238
    halign = center
    valign = center
}

# Now playing (bin/lock-media): the song, then previous / play-pause / next buttons
# (click, or the media keys). Everything stays empty when no player is active.
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media text
    color = $text_color
    font_size = 12
    font_family = $font
    position = 0, 105
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media button prev
    color = $text_color
    font_size = 18
    font_family = $font_mono
    onclick = playerctl previous
    position = -64, 60
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media button toggle
    color = $text_color
    font_size = 22
    font_family = $font_mono
    onclick = playerctl play-pause
    position = 0, 60
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media button next
    color = $text_color
    font_size = 18
    font_family = $font_mono
    onclick = playerctl next
    position = 64, 60
    halign = center
    valign = bottom
}
