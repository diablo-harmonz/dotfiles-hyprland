# Default theme: blurred wallpaper, date and greeting top left, hours over minutes in the
# middle, a small password pill under them. Sourced by ~/.config/hypr/hyprlock.conf.

background {
    monitor =
    path = $HOME/.cache/wallpaper/current
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    vibrancy = 0.2
}

# Date, top left
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%a, %b %d"
    color = $text_color
    font_size = 15
    font_family = $font
    position = 110, -110
    halign = left
    valign = top
}

# Greeting under the date
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ "$h" -lt 12 ]; then g="Good morning"; elif [ "$h" -lt 18 ]; then g="Good afternoon"; else g="Good evening"; fi; echo "$g, $USER"
    color = $text_color
    font_size = 15
    font_family = $font
    position = 110, -140
    halign = left
    valign = top
}

# Hours
label {
    monitor =
    text = cmd[update:1000] date +"%I"
    color = $hour_color
    font_size = 150
    font_family = $font_bold
    position = 0, 210
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $minute_color
    font_size = 150
    font_family = $font_bold
    position = 0, 10
    halign = center
    valign = center
}

# Password pill: always visible (no fade while empty)
input-field {
    monitor =
    size = 260, 40
    outline_thickness = 2
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $input_outer
    inner_color = $input_inner
    font_color = $input_font
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = $check_color
    fail_color = $fail_color
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $caps_color
    position = 0, -170
    halign = center
    valign = center
}
