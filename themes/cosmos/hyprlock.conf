# Cosmos theme: HUD-style lock screen. Sourced by ~/.config/hypr/hyprlock.conf, which
# sets the colors ($hour_color...) from the wallpaper and the fonts ($font, $font_bold).

# HUD look: the mono font of the design tokens for all text here (the rest of the desktop
# keeps the UI font)
$font      = $font_mono
$font_bold = $font_mono Bold

background {
    monitor =
    path = $HOME/.cache/wallpaper/current
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.2
}

# Top left: stardate (year.day-of-year) and pilot
label {
    monitor =
    text = cmd[update:60000] echo "STARDATE $(date +%Y.%j)"
    color = $text_color
    font_size = 13
    font_family = $font
    position = 80, -70
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "PILOT // $(echo "$USER" | tr a-z A-Z)"
    color = $caps_color
    font_size = 13
    font_family = $font
    position = 80, -96
    halign = left
    valign = top
}

# Top right: battery as power cells
label {
    monitor =
    text = cmd[update:30000] echo "POWER CELLS $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo --)%"
    color = $caps_color
    font_size = 13
    font_family = $font
    position = -80, -70
    halign = right
    valign = top
}

# Middle: time, then the status line
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $hour_color
    font_size = 110
    font_family = $font_bold
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = SYSTEM LOCKED // AUTH REQUIRED
    color = $text_color
    font_size = 14
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 44
    outline_thickness = 2
    rounding = $radius_lg
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = $input_outer
    inner_color = $input_inner
    font_color = $input_font
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span alpha="60%">ENTER ACCESS CODE</span>
    hide_input = false
    check_color = $check_color
    fail_color = $fail_color
    fail_text = ACCESS DENIED ($ATTEMPTS)
    capslock_color = $caps_color
    position = 0, -80
    halign = center
    valign = center
}

# Now playing (bin/lock-media): the song, then previous / play-pause / next buttons
# (click, or the media keys). Everything stays empty when no player is active.
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media label 'NOW PLAYING // '
    color = $text_color
    font_size = 11
    font_family = $font
    position = 0, 115
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media button prev
    color = $text_color
    font_size = 18
    font_family = $font_mono
    onclick = playerctl previous
    position = -70, 70
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media button toggle
    color = $text_color
    font_size = 22
    font_family = $font_mono
    onclick = playerctl play-pause
    position = 0, 70
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/lock-media button next
    color = $text_color
    font_size = 18
    font_family = $font_mono
    onclick = playerctl next
    position = 70, 70
    halign = center
    valign = bottom
}

# Bottom: image credit
label {
    monitor =
    text = NGC 1566 // NASA, ESA, CSA, J. Lee (NOIRLab), A. Pagan (STScI)
    color = rgba(ffffff55)
    font_size = 9
    font_family = $font
    position = -20, 14
    halign = right
    valign = bottom
}
