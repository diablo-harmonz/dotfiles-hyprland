# mpv: video player (also used by yt-x). Media keys and the Waybar player button
# control it through mpv-mpris (loaded from /etc/mpv/scripts).

# Video: the Vulkan/OpenGL renderer with hardware decoding (AMD VA-API), falls back
# to software when a codec is not supported
vo=gpu-next
hwdec=auto-safe

# Streams (YouTube via yt-dlp): at most 1080p, best audio
ytdl-format=bv*[height<=1080]+ba/b[height<=1080]/b

# Resume where a file was left; keep the window open at the end of a video
save-position-on-quit
keep-open=yes

# Subtitles: load matching files next to the video, prefer English then Vietnamese
sub-auto=fuzzy
slang=en,eng,vi,vie
alang=en,eng,vi,vie,jpn,ja

# Volume: start at 100, allow boosting up to 150 with the 0/9 keys
volume=100
volume-max=150

# Screenshots (s key) go next to the system ones
screenshot-directory=~/Pictures/Screenshots
screenshot-format=png
screenshot-template=mpv_%F_%P

# Small on-screen text in the bar font
osd-font="FiraCode Nerd Font"
osd-font-size=28
