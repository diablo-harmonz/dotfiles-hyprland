# kitty: the terminal (SUPER+Return). Its own image protocol keeps transparency, which
# rmpc's record picture relies on.
# Colors: colors.conf, written by Matugen from the wallpaper (bin/wallpaper); every
# running kitty reloads on SIGUSR1 (Matugen's post_hook sends it).

font_family                 FiraCode Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto

remember_window_size        no
initial_window_width        110c
initial_window_height       28c
window_padding_width        10
hide_window_decorations     yes
confirm_os_window_close     0

background_opacity          0.7
dynamic_background_opacity  yes

cursor_shape                beam
cursor_blink_interval       0.5
cursor_stop_blinking_after  15
# No trail behind the cursor when it jumps
cursor_trail                0

scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no

tab_bar_min_tabs            2
tab_bar_style               powerline

include colors.conf
