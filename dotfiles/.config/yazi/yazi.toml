# Yazi (terminal file manager). Open with `y` in zsh (the shell follows to the folder you
# leave in) or SUPER+SHIFT+E. Colors: theme.toml, generated by Matugen from the wallpaper.
# Defaults: https://github.com/sxyazi/yazi/blob/v26.9.1/yazi-config/preset/yazi-default.toml

[mgr]
ratio      = [ 1, 3, 4 ]   # parent | current | preview (wider preview than the default)
sort_dir_first = true
show_hidden = false        # toggle with `.`
linemode   = "size"
