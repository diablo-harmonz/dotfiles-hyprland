# Matugen: colors from the wallpaper. Run by bin/wallpaper after every change:
#   matugen image <file> --mode dark --source-color-index 0
# Each template is rendered to an app's config dir (those files are git-ignored).
[config]

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 -x waybar || true'

[templates.wezterm]
input_path = '~/.config/matugen/templates/wezterm.lua'
output_path = '~/.config/wezterm/colors.lua'

[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook = 'hyprctl eval "$(cat ~/.config/hypr/colors.lua)" >/dev/null 2>&1 || true'

[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock.conf'
output_path = '~/.config/hypr/hyprlock-colors.conf'

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout.css'
output_path = '~/.config/wlogout/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/matugen.css'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/matugen.css'

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync.css'
output_path = '~/.config/swaync/style.css'
post_hook = 'swaync-client -rs >/dev/null 2>&1 || true'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.kde]
input_path = '~/.config/matugen/templates/kde.colors'
output_path = '~/.local/share/color-schemes/Matugen.colors'

[templates.firefox]
input_path = '~/.config/matugen/templates/firefox.css'
output_path = '~/.config/firefox-chrome/colors.css'

[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-theme'
output_path = '~/.config/cava/themes/matugen'
post_hook = 'pkill -USR1 -x cava || true'
