# Generated by Matugen from {{image}} - do not edit (see ~/.config/matugen)
# navi config: the notebook lives in ~/.config/navi/cheats (dotfiles/.config/navi/cheats);
# fzf on the terminal's translucent background with the wallpaper accents, like yt-x.
cheats:
  paths:
    - ~/.config/navi/cheats

# navi 2.24 takes only colour names for its columns (cyan, white, grey...); the
# accents (selected line, matches, border) come from the wallpaper through fzf below
style:
  tag:
    color: cyan
    width_percentage: 22
    min_width: 16
  comment:
    color: white
    width_percentage: 42
    min_width: 30
  snippet:
    color: grey

finder:
  command: fzf
  overrides: >-
    --layout=reverse --border=rounded --info=inline-right --pointer=▌ --gutter=" " --prompt="  "
    --color=bg:-1,gutter:-1,preview-bg:-1,list-bg:-1,input-bg:-1
    --color=bg+:{{colors.surface_container_highest.default.hex}},fg+:{{colors.on_surface.default.hex}}
    --color=hl:{{colors.primary.default.hex}},hl+:{{colors.primary.default.hex}}
    --color=border:{{colors.outline_variant.default.hex}},prompt:{{colors.primary.default.hex}}
    --color=pointer:{{colors.primary.default.hex}},info:{{colors.outline.default.hex}}

shell:
  command: zsh
