# Commit text directly and fix marks with emulated backspaces (no preedit underline)
Mode=Uinput (Smooth)
InputMethod=Telex
# w types ư everywhere, also at the start of a word (default Non-Start: only after a
# consonant, e.g. nw -> nư); ww types a plain w
W2U=Everywhere
# Same choices as the previous Unikey config
SpellCheck=False
EnableMacro=False
ModernStyle=False

# No hotkey for Lotus's mode menu (default: the ` key, which is needed for typing code
# and Markdown). An empty list disables it; switch modes in fcitx5-configtool instead.
[ModeMenuKey]
