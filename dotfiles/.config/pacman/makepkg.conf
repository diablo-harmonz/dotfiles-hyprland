# User overrides for makepkg (yay builds AUR packages with it), read after
# /etc/makepkg.conf. Linked to ~/.config/pacman by setup/link-dotfiles.sh.

# No separate <pkg>-debug packages: only the system option is flipped, the rest of
# /etc/makepkg.conf OPTIONS stays as Arch ships it.
OPTIONS=("${OPTIONS[@]/#debug/!debug}")
