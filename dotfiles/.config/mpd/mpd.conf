# MPD: music daemon for rmpc. Runs as a user service (systemctl --user mpd.service),
# plays the files in ~/Music through PipeWire. Only listens on this machine.
# mpd-mpris (user service) lets media keys and the Waybar player button control it.

music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/state/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"

bind_to_address     "127.0.0.1"
port                "6600"

# Pick up new or changed files in ~/Music by itself
auto_update         "yes"
restore_paused      "yes"

audio_output {
    type            "pipewire"
    name            "PipeWire"
}
