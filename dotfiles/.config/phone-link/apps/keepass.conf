# phone-link app: the KeePassXC database, opened on the iPhone with KeePassium.
# Keys: label (menu text), file (default path, asked once on first use; the choice is
# kept in ~/.local/state/phone-link/<app>.path), upload (yes = the phone can send a copy
# back; it is saved next to the file as <name>-phone-<date>, never over it).
label="KeePass database"
file="$HOME/Passwords/main.kdbx"
upload=yes
