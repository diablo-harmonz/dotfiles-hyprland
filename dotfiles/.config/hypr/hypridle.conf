# hypridle: dim -> lock -> screens off -> suspend (battery only).
# Started from conf/autostart.lua. `caffeine` (SUPER+SHIFT+C or the waybar cup)
# holds a systemd idle/sleep inhibitor, which pauses every step below.
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock               # loginctl lock-session runs this
    before_sleep_cmd = loginctl lock-session            # always lock before suspend
    # After resume: screens on, twice. A single early "dpms on" left the lock screen black on
    # 2026-11-12 (the GPU may not be ready that early). Any key or mouse movement also turns
    # them on (misc.key_press_enables_dpms). hyprlock is not restarted here: swapping it
    # flashes Hyprland's "lockscreen died" page; SUPER+CTRL+L does that when really needed.
    # bin/dpms only acts when a screen is off: a plain "dpms on" sent while the screen was
    # already on (woken by a key) switched it off again.
    after_sleep_cmd = sleep 1; ~/.local/bin/dpms on; sleep 2; ~/.local/bin/dpms on
}

# 5 min: dim the laptop panel
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screens off
listener {
    timeout = 660
    on-timeout = ~/.local/bin/dpms off
    on-resume = ~/.local/bin/dpms on
}

# 30 min: suspend, only when running on battery and nothing is playing (music or video
# in any player, including Firefox: they report through MPRIS / playerctl)
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && ! playerctl -a status 2>/dev/null | grep -qx Playing && systemctl suspend
}
