# hypridle: dim -> lock -> screens off -> suspend (battery only).
# Started from conf/autostart.lua. `caffeine` (SUPER+SHIFT+C or the waybar cup)
# holds a systemd idle/sleep inhibitor, which pauses every step below.
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock               # loginctl lock-session runs this
    before_sleep_cmd = loginctl lock-session            # always lock before suspend
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

# 5 min: dim the laptop panel
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screens off
listener {
    timeout = 660
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms("off"))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms("on"))'
}

# 30 min: suspend, only when running on battery
listener {
    timeout = 1800
    on-timeout = [ "$(cat /sys/class/power_supply/AC/online)" = 0 ] && systemctl suspend
}
