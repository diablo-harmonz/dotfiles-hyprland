# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# Yakuake: floating drop-down terminal at the top, visible on every workspace
windowrule = float on, pin on, match:class ^(org.kde.yakuake)$
windowrule = size (monitor_w*1) (monitor_h*0.5), move 0 0, match:class ^(org.kde.yakuake)$
