# hyprlock: colors (Matugen) and behaviour here; the layout (background, labels, password
# field) comes from the active theme pack: ~/.config/theme/hyprlock.conf (bin/theme).
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# Fallback colors, used until Matugen has written hyprlock-colors.conf (wallpaper restore)
$hour_color    = rgb(bbc3ff)
$minute_color  = rgb(e4e1e6)
$text_color    = rgb(e4e1e6)
$input_inner   = rgba(2a2a33cc)
$input_outer   = rgba(e6bad7cc)
$input_font    = rgb(e4e1e6)
$check_color   = rgb(bbc3ff)
$fail_color    = rgb(ffb4ab)
$caps_color    = rgb(c4c5dd)
source = ~/.config/hypr/hyprlock-colors.conf

# Fonts from the design tokens (bin/tokens: $font_ui, $font_mono); defaults if missing
$font_ui   = Noto Sans
$font_mono = FiraCode Nerd Font
source = ~/.config/theme-tokens/tokens.conf
$font      = $font_ui
$font_bold = $font_ui Bold

general {
    # Enter on an empty field (e.g. the key that woke the laptop) is ignored instead of
    # counting as a wrong password: three failures lock the account for 10 minutes
    # (pam_faillock)
    ignore_empty_input = true
    # The pointer stays visible: the media buttons (theme layouts, bin/lock-media) take clicks
    hide_cursor = false
}

# Layout of the active theme (themes/<name>/hyprlock.conf in the dotfiles repo)
source = ~/.config/theme/hyprlock.conf
