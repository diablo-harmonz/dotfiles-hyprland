# hyprlock: blurred wallpaper, date and greeting top left, hours over minutes in the
# middle, a small password pill under them. Colors follow the wallpaper (Matugen).
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# Fallback colors, used until Matugen has written hyprlock-colors.conf (wallpaper restore)
$hour_color    = rgb(bbc3ff)
$minute_color  = rgb(e4e1e6)
$text_color    = rgb(e4e1e6)
$input_inner   = rgba(2a2a33cc)
$input_outer   = rgba(e6bad7cc)
$input_font    = rgb(e4e1e6)
$check_color   = rgb(bbc3ff)
$fail_color    = rgb(ffb4ab)
$caps_color    = rgb(c4c5dd)
source = ~/.config/hypr/hyprlock-colors.conf

$font      = Fira Code
$font_bold = Fira Code Bold

general {
    # Enter on an empty field (e.g. the key that woke the laptop) is ignored instead of
    # counting as a wrong password: three failures lock the account for 10 minutes
    # (pam_faillock)
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.cache/wallpaper/current
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
    vibrancy = 0.2
}

# Date, top left
label {
    monitor =
    text = cmd[update:60000] LC_TIME=C date +"%a, %b %d"
    color = $text_color
    font_size = 15
    font_family = $font
    position = 110, -110
    halign = left
    valign = top
}

# Greeting under the date
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ "$h" -lt 12 ]; then g="Good morning"; elif [ "$h" -lt 18 ]; then g="Good afternoon"; else g="Good evening"; fi; echo "$g, $USER"
    color = $text_color
    font_size = 15
    font_family = $font
    position = 110, -140
    halign = left
    valign = top
}

# Hours
label {
    monitor =
    text = cmd[update:1000] date +"%I"
    color = $hour_color
    font_size = 150
    font_family = $font_bold
    position = 0, 210
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $minute_color
    font_size = 150
    font_family = $font_bold
    position = 0, 10
    halign = center
    valign = center
}

# Password pill: always visible (no fade while empty)
input-field {
    monitor =
    size = 260, 40
    outline_thickness = 2
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $input_outer
    inner_color = $input_inner
    font_color = $input_font
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    check_color = $check_color
    fail_color = $fail_color
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $caps_color
    position = 0, -170
    halign = center
    valign = center
}
