# hyprsunset: warmer screen colours in the evening (night light).
# Started from conf/autostart.lua. Adjust live with:
#   hyprctl hyprsunset temperature 4000   |   hyprctl hyprsunset identity
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/

# Daytime: no colour change
profile {
    time = 6:30
    identity = true
}

# Evening: warm
profile {
    time = 19:00
    temperature = 4500
}
